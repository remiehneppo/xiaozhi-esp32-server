# #####################################################################################
# ################################mô hìnhcấu hình######################################

prompt: |
  Bạn là trợ lý giọng nói tiếng Việt cho người dùng ở Việt Nam, tên là {{assistant_name}}.
  Hãy trả lời ngắn gọn, tự nhiên, lịch sự và thân thiện như đang trò chuyện trực tiếp.
  Mặc định dùng ngữ cảnh Việt Nam: múi giờ UTC+7, tiền Việt Nam đồng, địa danh và thói quen giao tiếp của người Việt.
  Nếu người dùng không nói rõ địa điểm, hãy mặc định là Việt Nam; nếu cần dữ liệu mới như tin tức, giá cả, quy định hoặc thời tiết nơi khác, hãy dùng công cụ phù hợp nếu có.
  Khi đọc ngày giờ, số điện thoại, địa chỉ, đơn vị đo và tiền tệ, hãy diễn đạt theo cách người Việt thường nói.
  Không dùng tiếng Trung. Chỉ dùng tiếng Anh khi người dùng yêu cầu hoặc thuật ngữ đó phổ biến hơn bằng tiếng Anh.

# mặc địnhtệp
prompt_template: agent-base-prompt.txt

# lỗi
system_error_response: "Mình đang gặp chút trục trặc, bạn thử lại sau một lát nhé."

# kết thúcprompt
end_prompt:
  enable: true # cókết thúc
  # kết thúc
  prompt: |
    Hãy kết thúc cuộc trò chuyện bằng một câu tiếng Việt ngắn gọn, thân thiện và tự nhiên.

# xử lý(The module selected for specific processing)
selected_module:
  # giọng nói，mặc địnhSileroVADmô hình
  VAD: SileroVAD
  # giọng nóinhận dạng，mặc địnhFunASRcục bộmô hình
  ASR: FunASR
  # cấu hìnhtương ứngtypeLLM
  LLM: ChatGLMLLM
  # mô hình
  VLLM: ChatGLMVLLM
  # TTScấu hìnhtương ứngtypeTTS
  TTS: EdgeTTS
  # ký ức，mặc địnhký ức；ký ức，mem0ai；，cục bộmem_local_short
  Memory: nomem
  # ý địnhnhận dạng，、、nhận dạngthoát。
  # ý địnhnhận dạng，đặt：nointent
  # ý địnhnhận dạngintent_llm。：，：ý địnhnhận dạng，xử lý，iot
  # ý địnhnhận dạngfunction_call，：LLMfunction_call，：công cụ、，iot
  # mặc địnhChatGLMLLMfunction_call，LLMđặt：DoubaoLLM，model_name：doubao-1-5-pro-32k-250115
  Intent: function_call

# ý địnhnhận dạng，dùng choý định，：
Intent:
  # ý địnhnhận dạng
  nointent:
    # type
    type: nointent
  intent_llm:
    # type
    type: intent_llm
    # ý địnhnhận dạngmô hình
    # ，mặc địnhselected_module.LLMmô hìnhý địnhnhận dạngmô hình
    # selected_module.LLMý địnhnhận dạng，LLMý địnhnhận dạng，ChatGLMLLM
    llm: ChatGLMLLM
    # plugins_func/functions，cấu hình，tải，tảihội thoạifunction
    # mặc định"handle_exit_intent(thoátnhận dạng)"、"play_music()"，tải
    # tải、、tải
    functions:
      - web_search
      - get_weather
      - get_news_from_newsnow
      - play_music
  function_call:
    # type
    type: function_call
    # plugins_func/functions，cấu hình，tải，tảihội thoạifunction
    # mặc định"handle_exit_intent(thoátnhận dạng)"、"play_music()"，tải
    # tải、、tải
    functions:
      - change_role
      - web_search                  # Tìm kiếm trực tuyến
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_musicmáy chủ，hass_play_musichome assistantbên ngoài
      # hass_play_music，play_music，
      - play_music
      #- hass_get_state
      #- hass_set_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # 1000lần
    api_key: mem0ai api key
  powermem:
    # PowerMemOceanBaseagentký ức，cục bộLLMtiến hànhký ức
    # ：PowerMem，LLMdữ liệu
    # - sqlite + LLM(glm-4-flash) = 
    # - LLMdữ liệu = tương ứngdịch vụ
    # GitHub: https://github.com/oceanbase/powermem
    # : https://www.powermem.ai/
    # : https://github.com/oceanbase/powermem/tree/main/examples
    type: powermem
    # có
    # - false: ký ứcchế độ(AsyncMemory)
    # - true: chế độ(UserMemory)，thông tin
    # : oceanbase、seekdb、sqlite (powermem 0.3.0+)
    enable_user_profile: true
    # ========== LLM cấu hình ==========
    # : https://bailian.console.aliyun.com/?apiKey=1#/api-key
    # AI(): https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    llm:
      provider: openai  # tùy chọn: qwen, openai, zhipu 
      config:
        api_key: LLM API
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1  # tùy chọn，định nghĩadịch vụđịa chỉ
    # ========== Embedding cấu hình ==========
    embedder:
      provider: openai  # tùy chọn: qwen, openai 
      config:
        api_key: mô hìnhAPI
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024  # ，1536cấu hình

    # ========== Database cấu hình ==========
    # oceanbase(,hiệu suất), seekdb(,AIáp dụnglưu trữ), postgres, sqlite()
    # : oceanbase、seekdb、sqlite
    vector_store:
      provider: sqlite
      config: {}  # SQLite cấu hình
      # OceanBase cấu hình:
      # provider: oceanbase
      # config:
      #   host: 127.0.0.1
      #   port: 2881
      #   user: root@test
      #   password: your_password
      #   db_name: powermem
      #   collection_name: memories  # mặc định，tạolỗixóa
      #   embedding_model_dims: 1024  # ，mô hình，：embedding-21024，embedding-32048
  nomem:
    # ký ức，nomem
    type: nomem
  mem_local_short:
    # cục bộký ức，selected_modulellm，dữ liệulưucục bộmáy chủ，bên ngoàimáy chủ
    type: mem_local_short
    # ký ứclưu trữmô hình
    # ，mặc địnhselected_module.LLMmô hìnhý địnhnhận dạngmô hình
    # selected_module.LLMký ứclưu trữ，LLMý địnhnhận dạng，ChatGLMLLM
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
  FunASRServer:
    # FunASR，FunASRAPIdịch vụ，
    # ：mkdir -p ./funasr-runtime-resources/models
    # ：sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # ，tiếp tục：cd FunASR/runtime
    # thoát，tiếp tục：nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # ，tiếp tục：tail -f log.txt
    # ，mô hìnhnhật ký，
    # CPU，GPU，：https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Sherpa-ONNX cục bộgiọng nóinhận dạng（mô hình）
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # mô hình：sense_voice ()  paraformer ()
    model_type: sense_voice
  SherpaParaformerASR:
    # giọng nóinhận dạngmô hình，hiệu suất（mô hình，RK3566-2g）
    # cấu hình：docs/sherpa-paraformer-guide.md
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # Keythông tin
    # https://console.volcengine.com/speech/app
    # DoubaoASRDoubaoStreamASR：DoubaoASRlần，DoubaoStreamASR
