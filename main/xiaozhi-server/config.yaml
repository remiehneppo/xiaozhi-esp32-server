# Trong phát triển, tạo thư mục data ở thư mục gốc, sau đó tạo file trống tên là 【.config.yaml】 trong thư mục data
# Sau đó muốn thay thế hay ghi đè cấu hình nào, thì sửa file 【.config.yaml】, không phải file 【config.yaml】
# Hệ thống sẽ ưu tiên đọc cấu hình file 【data/.config.yaml】, nếu cấu hình trong 【.config.yaml】 không tồn tại, hệ thống sẽ tự động đọc file 【config.yaml】.
# Cách làm này giúp đơn giản hóa cấu hình, bảo vệ an toàn khóa bí mật của bạn.
# Nếu bạn sử dụng bảng điều khiển, thì tất cả cấu hình dưới đây sẽ không có hiệu lực, vui lòng sửa cấu hình trong bảng điều khiển

# #####################################################################################
# #############################Dưới đây là cấu hình vận hành cơ bản của server####################################
server:
  # Địa chỉ và cổng nghe của server (Địa chỉ và cổng nghe của server)
  ip: 0.0.0.0
  port: 8000
  # Cổng dịch vụ http, dùng cho giao diện OTA đơn giản (triển khai dịch vụ đơn), và giao diện phân tích thị giác
  http_port: 8003
  # Cấu hình websocket này chỉ địa chỉ websocket mà giao diện ota gửi đến thiết bị
  # Nếu theo cách mặc định, giao diện ota sẽ tự động sinh địa chỉ websocket, và xuất trong log khởi động, địa chỉ này bạn có thể dùng trình duyệt truy cập giao diện ota để kiểm tra
  # Khi bạn dùng docker triển khai hoặc dùng triển khai (dùng ssl, tên miền) thì chưa chắc đã chính xác
  # Vì vậy nếu bạn dùng docker triển khai thì đặt websocket thành địa chỉ mạng nội bộ
  # Nếu bạn dùng triển khai thì đặt websocket thành địa chỉ
  websocket: ws://ip_hoac_ten_mien_cua_ban:cong/xiaozhi/v1/
  # Địa chỉ giao diện phân tích thị giác
  # Địa chỉ giao diện phân tích thị giác gửi đến thiết bị
  # Nếu theo cách mặc định bên dưới, hệ thống sẽ tự động sinh địa chỉ nhận diện thị giác, và xuất trong log khởi động, địa chỉ này bạn có thể dùng trình duyệt truy cập để kiểm tra
  # Khi bạn dùng docker triển khai hoặc dùng triển khai (dùng ssl, tên miền) thì chưa chắc đã chính xác
  # Vì vậy nếu bạn dùng docker triển khai thì đặt vision_explain thành địa chỉ mạng nội bộ
  # Nếu bạn dùng triển khai thì đặt vision_explain thành địa chỉ
  vision_explain: http://ip_hoac_ten_mien_cua_ban:cong/mcp/vision/explain
  # Độ lệch múi giờ thông tin trả về OTA. Việt Nam dùng UTC+7.
  timezone_offset: +7
  # Cấu hình xác thực
  auth:
    # Có bật xác thực không
    enabled: false
    # Danh sách ID thiết bị trong whitelist
    # Nếu thuộc thiết bị trong whitelist, không kiểm tra token, trực tiếp cho qua
    allowed_devices:
      - "11:22:33:44:55:66"
 # Cấu hình MQTT gateway, dùng để gửi qua OTA đến thiết bị, cấu hình theo file .env của mqtt_gateway, định dạng là host:port
  mqtt_gateway: null
  # Khóa chữ ký MQTT, dùng để sinh mật khẩu kết nối MQTT, cấu hình theo file .env của mqtt_gateway
  mqtt_signature_key: null
  # Cấu hình UDP gateway
  udp_gateway: null
log:
  # Đặt định dạng log xuất ra console, thời gian, cấp độ log, nhãn, tin nhắn
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Đặt định dạng log xuất ra file, thời gian, cấp độ log, nhãn, tin nhắn
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Đặt cấp độ log: INFO, DEBUG
  log_level: INFO
  # Đặt đường dẫn log
  log_dir: tmp
  # Đặt file log
  log_file: "server.log"
  # Đặt đường dẫn file dữ liệu
  data_dir: data

# Xóa file sau khi sử dụng xong file âm thanh (Xóa file khi bạn đã xong sử dụng nó)
delete_audio: true
# Bao lâu không có inputgiọng nói thìngắt kết nối (giây), mặc định 2 phút, tức 120 giây
close_connection_no_voice_time: 120
# Thời gianquá thời gianyêu cầu TTS (giây)
tts_timeout: 10
# Thời gianquá thời gian gọi công cụ (giây)
tool_call_timeout: 30
# Bật tăng tốc từ đánh thức
enable_wakeup_words_response_cache: true
# Có trả lời từ đánh thức khi mở đầu không
enable_greeting: true
# Có bật âm thanh nhắc nhở sau khi nói xong không
enable_stop_tts_notify: false
# Có bật âm thanh nhắc nhở sau khi nói xong không，địa chỉ
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Có bật cơ chế heartbeat giữ sống WebSocket không
enable_websocket_ping: false


# Cấu hình độ trễ gửi âm thanh TTS
# tts_audio_send_delay: Kiểm soát khoảng cách gửi gói âm thanh
#   0: Sử dụng kiểm soát thời gian chính xác, khớp nghiêm ngặt tần suất khung âm thanh (mặc định, tính theo tần suất khung khi chạy)
#   > 0: Gửi bằng độ trễ cố định (ms), ví dụ: 60
tts_audio_send_delay: 0

exit_commands:
  - "thoát"
  - "đóng"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opustần số lấy mẫu[8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# kiểm tracấu hình
module_test:
  test_sentences:
    - "Xin chào, bạn nghe rõ không?"
    - "Hôm nay thời tiết thế nào?"
    - "Một trăm nghìn cộng hai trăm năm mươi nghìn bằng bao nhiêu?"

# ，dùng chonhận dạngnội dung
wakeup_words:
  - "Xin chào"
  - "Chào bạn"
  - "Trợ lý ơi"
  - "Tiểu Trí ơi"
  - "Này bạn"
  - "Hello"
# MCPđịa chỉ，địa chỉđịnh dạng：ws://mcpip:cổng/mcp/?token=token
#  https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint:  websocketđịa chỉ

# ngữ cảnhcấu hình
# dùng chodữ liệu，dữ liệu、thông tin
# thêmngữ cảnh
