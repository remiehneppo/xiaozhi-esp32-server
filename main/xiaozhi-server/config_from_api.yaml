# Nếu bạn chỉ muốn cài `xiaozhi-server` theo kiểu nhẹ, chỉ dùng file cấu hình cục bộ thì không cần quan tâm file này và không cần sửa gì.
# Nếu muốn lấy cấu hình từ `manager-api`, xem bên dưới:
# Hãy sao chép file này vào thư mục `xiaozhi-server/data`, nếu chưa có `data` thì tạo mới và đặt tên file đã sao chép là `.config.yaml`
# Lưu ý: nếu trong thư mục `data` đã có file `.config.yaml` thì hãy xóa nó trước
# Trước tiên hãy khởi động `manager-api` và `manager-web`, đăng ký một tài khoản; tài khoản đăng ký đầu tiên sẽ là quản trị viên
# Dùng tài khoản quản trị viên, vào trang [Quản lý tham số], tìm `server.secret`, sao chép giá trị đó; lưu ý mỗi lần triển khai từ đầu thì `server.secret` sẽ thay đổi
# Mở file `.config.yaml` trong thư mục `data`, sửa `manager-api.secret` thành giá trị `server.secret` vừa sao chép
server:
  ip: 0.0.0.0
  port: 8000
  # Cổng dịch vụ HTTP, dùng cho giao diện phân tích ảnh
  http_port: 8003
  # Địa chỉ giao diện phân tích ảnh
  # Địa chỉ giao diện phân tích ảnh gửi tới thiết bị
  # Nếu giữ mặc định như dưới, hệ thống sẽ tự sinh địa chỉ phân tích ảnh và in ra log khởi động; bạn có thể mở bằng trình duyệt để kiểm tra
  # Khi deploy bằng Docker hoặc deploy công khai (SSL, domain), địa chỉ này có thể không chính xác
  # Vì vậy nếu deploy bằng Docker, hãy đặt `vision_explain` thành địa chỉ trong LAN
  # Nếu deploy công khai, hãy đặt `vision_explain` thành địa chỉ public
  vision_explain: http://địa_chỉ_ip_hoặc_domain:cổng/mcp/vision/explain
manager-api:
  # Địa chỉ `manager-api`, tốt nhất là IP trong LAN
  # Nếu deploy Docker, hãy điền `http://xiaozhi-esp32-server-web:8002/xiaozhi`
  url: http://127.0.0.1:8002/xiaozhi
# Token của `manager-api`, chính là `server.secret` vừa sao chép
  secret: giá_trị_server.secret_của_bạn
# File mẫu system prompt mặc định
prompt_template: agent-base-prompt.txt
