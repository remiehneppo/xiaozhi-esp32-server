version: '3'

services:
  # Máy chủ chính xiaozhi-esp32-server
  xiaozhi-esp32-server:
    image: ${DOCKER_REGISTRY:-remiehneppo}/xiaozhi-esp32-server:latest
    container_name: xiaozhi-esp32-server
    depends_on:
      - xiaozhi-esp32-server-db
      - xiaozhi-esp32-server-redis
    restart: always
    networks:
      - default
    ports:
      # WebSocket port nhận kết nối từ ESP32
      - "8000:8000"
      # HTTP port sử dụng cho Vision/VLM
      - "8003:8003"
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      # Thư mục chứa cấu hình động và log (.config.yaml nằm ở data/.config.yaml)
      - ./data:/opt/xiaozhi-esp32-server/data
      # Gắn tệp mô hình âm thanh SenseVoiceSmall
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt

  # Manager Web & Manager API Console
  xiaozhi-esp32-server-web:
    image: ${DOCKER_REGISTRY:-remiehneppo}/xiaozhi-esp32-server-web:latest
    container_name: xiaozhi-esp32-server-web
    restart: always
    networks:
      - default
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      # Cổng giao diện điều khiển Manager Web
      - "8002:8002"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=123456
      - SPRING_DATA_REDIS_HOST=xiaozhi-esp32-server-redis
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      - ./uploadfile:/uploadfile

  # Cơ sở dữ liệu MySQL
  xiaozhi-esp32-server-db:
    image: mysql:latest
    container_name: xiaozhi-esp32-server-db
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    networks:
      - default
    expose:
      - 3306
    volumes:
      - ./mysql/data:/var/lib/mysql
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS="--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"

  # Redis Cache
  xiaozhi-esp32-server-redis:
    image: redis:8.0
    expose:
      - 6379
    container_name: xiaozhi-esp32-server-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

  # VieNeu TTS Server (Giọng nói Tiếng Việt, chạy chế độ CPU)
  vieneu-tts-server:
    image: ${DOCKER_REGISTRY:-remiehneppo}/vieneu-tts-server:cpu-latest
    container_name: vieneu-tts-server
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - VIENEU_MODEL_ID=pnnbao-ump/VieNeu-TTS-v2-Turbo-GGUF
      - VIENEU_MODEL_FILE=vieneu-tts-v2-turbo.gguf
      - VIENEU_MODE=turbo
      - VIENEU_MODEL_DIR=/models
      - HF_HOME=/models
      - HUGGINGFACE_HUB_CACHE=/models/hub
      - VIENEU_DEFAULT_VOICE=Thục Đoan (Nữ - Miền Nam)
      - VIENEU_DEVICE=cpu          # Ép buộc sử dụng CPU
      - VIENEU_N_GPU_LAYERS=0      # Tắt các lớp chạy GPU
      - VIENEU_THREADS=4           # Số luồng CPU sử dụng (tùy chỉnh theo CPU thật)
      - VIENEU_N_CTX=2048
      - VIENEU_PRELOAD=true
      - VIENEU_FAKE=false
      - PORT=8004
      - TTS_API_KEY=
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ../vieneu-tts-server/models:/models
      - ../vieneu-tts-server/benchmarks:/app/benchmarks
    networks:
      - default

  # Whisper ASR Server (Nhận dạng giọng nói tiếng Việt PhoWhisper, chạy chế độ CPU)
  whisper-asr-server:
    image: ${DOCKER_REGISTRY:-remiehneppo}/whisper-asr-server:cpu-latest
    container_name: whisper-asr-server
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - WHISPER_MODEL=quocphu/PhoWhisper-ct2-FasterWhisper/PhoWhisper-small-ct2-fasterWhisper
      - WHISPER_DEVICE=cpu         # Ép buộc sử dụng CPU
      - WHISPER_COMPUTE_TYPE=int8  # Định dạng lượng tử hóa tối ưu cho CPU
      - WHISPER_LANGUAGE=vi
      - WHISPER_BEAM_SIZE=5
      - WHISPER_MODEL_DIR=/models
      - ASR_API_KEY=
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ../whisper-asr-server/models:/models
    networks:
      - default

networks:
  default:
