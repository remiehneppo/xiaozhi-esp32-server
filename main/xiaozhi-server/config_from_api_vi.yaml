# Mẫu cấu hình bootstrap cho chế độ Manager API/Web, tối ưu hóa cho người Việt Nam.
#
# Cách dùng:
# 1. Khởi động manager-api và manager-web.
# 2. Đăng ký tài khoản admin đầu tiên trong Manager Web.
# 3. Vào Quản lý tham số, lấy giá trị `server.secret`.
# 4. Copy file này thành `data/.config.yaml`.
# 5. Điền `manager-api.secret` bằng giá trị `server.secret` vừa lấy.
#
# Lưu ý:
# - Khi `read_config_from_api: true`, KHÔNG thêm `selected_module`, `LLM`, `ASR`,
#   `TTS`, `Intent`... vào file này. Các cấu hình model/agent thực tế sẽ được tải từ manager-api.
# - Địa chỉ public trả về cho ESP32 phải là domain/URL mà ESP32 truy cập được,
#   không dùng localhost, 127.0.0.1, hoặc tên service Docker nội bộ.
# - Các tham số nâng cao bên dưới được chia làm 2 nhóm:
#   * "bootstrap": Cần đặt trong file này vì xiaozhi-server cần biết trước khi
#     kết nối đến manager-api.
#   * "manager": Chỉ nên cấu hình trong Manager Web/DB (thêm dưới dạng comment để tham khảo).

read_config_from_api: true

server:
  # Địa chỉ listen của xiaozhi-server.
  ip: 0.0.0.0

  # Port WebSocket nội bộ của xiaozhi-server.
  # Nếu đang dùng cấu hình mặc định của dự án này, giữ 8010.
  port: 8010

  # Port HTTP nội bộ, dùng cho vision endpoint.
  # Nếu đang dùng cấu hình mặc định của dự án này, giữ 8013.
  http_port: 8013

  # Địa chỉ WebSocket public mà Manager API/OTA sẽ gửi cho ESP32 kết nối qua internet.
  websocket: wss://ws-ai.suprenam.id.vn/xiaozhi/v1/

  # Địa chỉ public của API phân tích ảnh/VLM.
  vision_explain: https://ai-server.suprenam.id.vn/mcp/vision/explain

  # Múi giờ Việt Nam.
  timezone_offset: +7

  # Tùy chọn bootstrap: khóa ký JWT nội bộ cho vision/token WebSocket.
  # Nếu bỏ trống, server sẽ ưu tiên sử dụng `manager-api.secret`.
  # auth_key: ""

  # Tùy chọn bootstrap: bật xác thực WebSocket phía xiaozhi-server.
  # Mặc định tắt để dễ test ESP32. Khi bật, cần cấu hình token/whitelist đồng bộ với Manager API.
  # auth:
  #   enabled: false
  #   allowed_devices:
  #     - "AA:BB:CC:DD:EE:FF"

  # Tùy chọn bootstrap: MQTT/UDP gateway nếu dùng gateway riêng thay vì WebSocket trực tiếp.
  # mqtt_gateway: null
  # mqtt_signature_key: null
  # udp_gateway: null

manager-api:
  # URL kết nối tới manager-api service (dùng service name nếu chung docker network).
  url: http://xiaozhi-esp32-server-web:8002/xiaozhi

  # Nếu xiaozhi-server chạy trực tiếp trên host máy chủ, có thể đổi thành:
  # url: http://127.0.0.1:8002/xiaozhi

  # Điền giá trị `server.secret` lấy từ Manager Web > Quản lý tham số.
  secret: thay_bang_server_secret_tu_manager_web

  # Timeout mỗi request đến manager-api, tính bằng giây.
  timeout: 30

  # Số lần retry khi kết nối đến manager-api bị lỗi/timeout tạm thời.
  max_retries: 6

  # Khoảng cách giữa các lần retry, tính bằng giây.
  retry_delay: 10

# File prompt template mặc định. Nội dung hệ thống sẽ do Manager API trả về.
prompt_template: agent-base-prompt.txt


# -----------------------------------------------------------------------------
# THAM SỐ CẤU HÌNH TRONG DB / MANAGER WEB (DÀNH CHO NGƯỜI VIỆT)
# -----------------------------------------------------------------------------
# Các giá trị bên dưới dùng làm placeholder/tham khảo để nhập trong Manager Web
# hoặc seed trực tiếp vào DB (bảng `sys_params`, `ai_model_config`, `ai_agent_template`).
# KHÔNG bỏ comment trực tiếp các cấu hình này trong file bootstrap này.

# ==========================================
# 1. [sys_params] Cấu hình Hệ thống & Hành vi
# ==========================================
# - delete_audio: true
#   Tự động xóa các file âm thanh tạm thời sau khi xử lý để tránh đầy bộ nhớ máy chủ.
# - close_connection_no_voice_time: 180
#   Tự động ngắt kết nối sau 180 giây không có giọng nói để tiết kiệm pin thiết bị và tài nguyên.
# - tts_timeout: 15
#   Timeout sinh giọng nói TTS (giây).
# - tool_call_timeout: 20
#   Timeout tối đa khi gọi công cụ bên ngoài (tìm kiếm, Home Assistant).
# - enable_wakeup_words_response_cache: true
#   Bật cache phản hồi từ đánh thức giúp giảm thời gian phản hồi ban đầu.
# - enable_greeting: true
#   Chào khi bắt đầu kết nối thoại để tạo cảm giác thân thiện.
# - enable_stop_tts_notify: false
#   Tắt âm thanh thông báo khi dừng TTS để cuộc đối thoại diễn ra tự nhiên hơn.
# - tts_audio_send_delay: 0
#   Gửi audio theo điều tiết chính xác thực tế của server (mặc định 0).
# - system_error_response: "Mình đang gặp chút trục trặc, bạn thử lại sau một lát nhé."
#   Câu thoại thông báo lỗi khi LLM/ASR/TTS gặp sự cố.
# - end_prompt: {"enable": true, "prompt": "Hãy kết thúc cuộc trò chuyện bằng một câu tiếng Việt ngắn gọn, thân thiện, tự nhiên."}
#   Prompt dẫn dắt LLM chào tạm biệt khi người dùng nói câu kết thúc.

# ==========================================
# 2. [sys_params] Ngôn ngữ và Từ khóa cho Người Việt
# ==========================================
# - exit_commands: thoát;đóng;tạm biệt;dừng lại;ngủ đi;hẹn gặp lại;tắt đi
#   Các khẩu lệnh dừng cuộc trò chuyện nhanh bằng tiếng Việt.
# - wakeup_words: xin chào;chào bạn;ơi trợ lý;này bạn;trợ lý ơi;hello;tiểu trí ơi
#   Các từ khóa đánh thức thiết bị bằng tiếng Việt để tăng độ nhạy nhận diện.
# - xiaozhi:
#   {
#     "type": "hello",
#     "version": 1,
#     "transport": "websocket",
#     "audio_params": {
#       "format": "opus",
#       "sample_rate": 24000,
#       "channels": 1,
#       "frame_duration": 60
#     }
#   }
#   Cấu hình thông số âm thanh Opus 24kHz giúp giọng thoại nghe trong và rõ ràng hơn.

# ==========================================
# 3. [sys_params] Cấu hình Plugins/Công cụ hữu ích
# ==========================================
#
# A. THỜI TIẾT (QWeather)
# - plugins.get_weather.default_location: Hà Nội
#   Địa điểm mặc định khi người dùng chỉ hỏi "Thời tiết thế nào?" mà không chỉ rõ địa danh.
# - plugins.get_weather.api_key: a861d0d5e7bf4ee1a83d9a9e4f96d4da
# - plugins.get_weather.api_host: mj7p3y7naa.re.qweatherapi.com
#
# B. NGHE NHẠC (Local Music)
# - plugins.play_music.music_dir: ./music
#   Đường dẫn chứa kho nhạc của bạn (ví dụ nhạc Việt, cải lương, nhạc trẻ).
# - plugins.play_music.music_ext: mp3;wav;p3
# - plugins.play_music.refresh_time: 300
#
# C. TÌM KIẾM WEB (Sử dụng 9Router hoặc Tavily)
# - plugins.web_search.provider: 9router
#   Sử dụng 9Router local để không bị giới hạn lượng request và bảo mật hơn.
# - plugins.web_search.base_url: http://your-9router-host:20128/v1
# - plugins.web_search.api_key: <your_9router_or_tavily_key>
# - plugins.web_search.model: searxng
# - plugins.web_search.search_type: web
# - plugins.web_search.max_results: 5
# - plugins.web_search.description: "Tìm kiếm thông tin trực tuyến khi người dùng hỏi về tin tức mới nhất, địa danh, giá cả, thời tiết hoặc thông tin tại Việt Nam."
#
# D. ĐIỀU KHIỂN NHÀ THÔNG MINH (Home Assistant)
# - plugins.home_assistant.base_url: http://homeassistant.local:8123
#   Địa chỉ Home Assistant cục bộ của bạn.
# - plugins.home_assistant.api_key: <long_lived_access_token>
# - plugins.home_assistant.devices: "Phòng khách,Đèn chính,light.living_room_light;Phòng khách,Quạt trần,fan.living_room_fan;Phòng ngủ,Máy lạnh,climate.bedroom_ac"
#   Danh sách thiết bị kết nối dạng: <Tên phòng>,<Tên thiết bị>,<entity_id>.
#   LLM có thể tắt/mở thiết bị khi người dùng yêu cầu tiếng Việt tự nhiên: "Bật đèn phòng khách lên".

# ==========================================
# 4. [ai_model_config] Các Model tối ưu tiếng Việt
# ==========================================
#
# A. VAD (Đoạt phát hiện giọng nói)
# - VAD_SileroVAD:
#   {"type":"silero","threshold":0.55,"threshold_low":0.35,
#    "model_dir":"models/snakers4_silero-vad","min_silence_duration_ms":300}
#   Ngưỡng threshold 0.55 giúp giảm nhận diện nhầm tiếng ồn/tiếng nhạc tạp âm tại Việt Nam.
#
# B. ASR (Nhận dạng giọng nói tiếng Việt qua 9Router với model whisper large turbo, fallback về whisper large)
# - ASR_OpenaiASR:
#   {"type":"openai","api_key":"<9router_api_key>",
#    "base_url":"http://your-9router-host:20128/v1/audio/transcriptions",
#    "model_name":"whisper-large-v3-turbo;whisper-large-v3","output_dir":"tmp/"}
#   Hỗ trợ fallback tự động: Nếu model turbo gặp sự cố hoặc quá tải, hệ thống tự động thử lại bằng model large thông thường.
#
# C. LLM (Trí tuệ nhân tạo suy luận tiếng Việt qua 9Router với model "flash")
# - LLM_OpenaiLLM:
#   {"type":"openai","model_name":"flash",
#    "base_url":"http://your-9router-host:20128/v1","api_key":"<9router_api_key>",
#    "timeout":60,"temperature":0.7,"max_tokens":1024}
#   Sử dụng model "flash" (ví dụ gemini-1.5-flash hoặc gemini-2.0-flash qua 9Router) giúp giảm độ trễ phản hồi thoại xuống tối đa.
#
# D. VLLM (Nhận diện hình ảnh qua 9Router với model "flash")
# - VLLM_OpenaiVLLM:
#   {"type":"openai","model_name":"flash",
#    "base_url":"http://your-9router-host:20128/v1","api_key":"<9router_api_key>",
#    "max_tokens":1024,"temperature":0.7,"top_p":1.0}
#
# E. TTS (Giọng nói Tiếng Việt cao cấp)
# - TTS_VieNeuTTS:
#   {"type":"openai","api_key":"local",
#    "api_url":"http://vieneu-tts-server:8004/v1/audio/speech",
#    "model":"vieneu-v2-turbo","voice":"Thục Đoan (Nữ - Miền Nam)",
#    "format":"wav","speed":1.0,"output_dir":"tmp/"}
#   Giọng nói VieNeuTTS sử dụng GPU phát âm cực kỳ tự nhiên, có ngắt nghỉ đúng văn phong của người Việt.
#
# - TTS_EdgeTTS (Phương án dự phòng không cần GPU):
#   {"type":"edge","voice":"vi-VN-HoaiMyNeural","output_dir":"tmp/","language":"Tiếng Việt"}
#
# F. Memory & Intent
# - Memory_nomem:
#   {"type":"nomem"}
# - Intent_function_call:
#   {"type":"function_call","functions":["web_search","get_weather","play_music","call_device"]}

# ==========================================
# 5. [ai_agent_template] Prompt hệ thống tối ưu cho người Việt
# ==========================================
# Bạn là trợ lý giọng nói tiếng Việt tên là Tiểu Trí. Bạn hỗ trợ người dùng tại Việt Nam một cách nhiệt tình, lịch sự và thân thiện.
# Hãy luôn tuân thủ các quy tắc phát ngôn và suy luận sau:
# 1. Trả lời ngắn gọn, súc tích, tốt nhất dưới 3 câu hoặc khoảng 30-50 từ vì câu trả lời sẽ được đọc trực tiếp ra loa thiết bị.
# 2. Xưng hô tự nhiên, lịch sự và phù hợp văn hóa Việt Nam, ví dụ: "Dạ, em nghe đây", "Dạ, em có thể giúp gì cho anh/chị ạ?". Có thể tự xưng là "em" hoặc "Tiểu Trí".
# 3. Mặc định ngữ cảnh thời tiết, giờ giấc, địa lý và tin tức là ở Việt Nam, ví dụ Hà Nội, Đà Nẵng, TP.HCM, trừ khi người dùng chỉ định vùng miền hoặc quốc gia khác.
# 4. Khi đọc ngày giờ, số điện thoại, địa chỉ, đơn vị tiền tệ như đồng/VNĐ, hãy diễn đạt theo cách người Việt thường nói, ví dụ "ngày mười hai tháng sáu", "hai mươi nghìn đồng".
# 5. Nếu người dùng hỏi thông tin cần thời gian thực như thời tiết, tin tức trong ngày, giá vàng hoặc tỷ giá hiện tại, hãy dùng công cụ web_search hoặc get_weather nếu có.
# 6. Không dùng tiếng Trung. Chỉ dùng tiếng Anh khi người dùng yêu cầu hoặc khi thuật ngữ kỹ thuật/khoa học đó phổ biến hơn bằng tiếng Anh.
