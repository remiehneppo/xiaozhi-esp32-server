services:
  vieneu-tts-server:
    build: .
    container_name: vieneu-tts-server
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      VIENEU_MODEL_ID: pnnbao-ump/VieNeu-TTS-v2-Turbo-GGUF
      VIENEU_MODEL_FILE: vieneu-tts-v2-turbo.gguf
      VIENEU_MODEL_DIR: /models
      VIENEU_DEFAULT_VOICE: Thục Đoan (Nữ - Miền Nam)
      VIENEU_DEVICE: cpu
      VIENEU_N_GPU_LAYERS: "0"
      VIENEU_THREADS: "4"
      VIENEU_N_CTX: "2048"
      VIENEU_PRELOAD: "true"
      PORT: "8004"
      # Set TTS_API_KEY and use the same value in xiaozhi-server TTS config if auth is needed.
      TTS_API_KEY: ""
    volumes:
      - ./models:/models
      - ./benchmarks:/app/benchmarks
